[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "four-model-demand-forecast"
version = "0.1.0"
description = "需求预测四模型项目：数据生成与日粒度标准化"
requires-python = ">=3.11,<3.15"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
generate-synthetic-data = "demand_forecast.data.synthetic:main"
build-daily-series = "demand_forecast.data.daily_series:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
